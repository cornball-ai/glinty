<body>
<div id="glinty-root"><div class="g-page"><div class="g-panel g-panel-plain" id="earshot-header"><a href="https://cornball.ai" class="g-link" target="_blank" rel="noopener noreferrer"><div class="g-layout-row" style="gap:12px;align-items:center"><img class="g-image" src="/static/logo.png" alt="cornball.ai" height="32"><span class="g-text g-text-heading">earshot</span></div></a></div><div class="g-layout-row" id="main-layout" style="gap:16px"><div class="g-panel g-panel-sidebar" id="left-sidebar" style="flex:0 0 280px;width:280px"><h3>History</h3><div id="config_display" data-g-output="config_display" data-g-kind="ui" class="g-ui-output"></div><div class="g-check"><input id="save_audio_files" data-g-target="save_audio_files" data-g-message="input" data-g-event="change" type="checkbox" class="g-checkbox"><label for="save_audio_files">Save audio files</label></div><div id="history_list" data-g-output="history_list" data-g-kind="ui" class="g-ui-output"></div></div><div class="g-layout-row" id="center-content" style="gap:16px;flex:1 1 0"><div class="g-panel g-panel-card" id="input-card" style="flex:2 1 0"><button type="button" id="record_btn" class="g-btn btn-record">Record</button><div class="g-divider g-divider-labelled"><span class="g-divider-label">or</span></div><div class="g-field"><input id="audio_file" data-g-target="audio_file" data-g-message="input" type="file" class="g-file" data-g-upload="audio_file" accept=".wav,.mp3,.m4a,.ogg,.flac,.webm"></div><div class="g-check"><input id="stream_mode" data-g-target="stream_mode" data-g-message="input" data-g-event="change" type="checkbox" class="g-checkbox"><label for="stream_mode">Live transcription</label></div><audio id="audio_preview" data-g-output="audio_preview" data-g-kind="audio" class="g-audio-output" controls="controls"></audio><div class="g-field"><label for="prompt">Prompt (optional)</label><input id="prompt" data-g-target="prompt" data-g-message="input" data-g-event="input" type="text" class="g-input" value="" placeholder="Names, acronyms, or terms"></div><button id="transcribe" data-g-target="transcribe" data-g-message="event" type="button" class="g-btn g-btn-primary">Transcribe</button></div><div class="g-layout-col" style="gap:12px;flex:3 1 0"><div class="g-conditional" data-g-cond="{&quot;op&quot;:&quot;is&quot;,&quot;id&quot;:&quot;stream_mode&quot;,&quot;values&quot;:[true]}"><div class="g-panel g-panel-card"><div class="g-panel-title">Live</div><span id="live_text" data-g-output="live_text" data-g-kind="text" class="g-output"></span></div></div><div id="results_tabs" class="g-tabset"><div class="g-tab-nav"><button type="button" class="g-tab-btn g-tab-active" data-g-tab-panel="Text" data-g-target="results_tabs" data-g-message="input" data-g-value="Text">Text</button><button type="button" class="g-tab-btn" data-g-tab-panel="Segments" data-g-target="results_tabs" data-g-message="input" data-g-value="Segments">Segments</button><button type="button" class="g-tab-btn" data-g-tab-panel="Raw" data-g-target="results_tabs" data-g-message="input" data-g-value="Raw">Raw</button></div><div class="g-tab-bodies"><div class="g-tab-body" data-g-tab-panel="Text"><pre id="transcription" data-g-output="transcription" data-g-kind="text" class="g-verbatim-output"></pre></div><div class="g-tab-body g-hidden" data-g-tab-panel="Segments"><div id="segments" data-g-output="segments" data-g-kind="table" class="g-table-output"></div></div><div class="g-tab-body g-hidden" data-g-tab-panel="Raw"><pre id="raw" data-g-output="raw" data-g-kind="text" class="g-verbatim-output"></pre></div></div></div></div></div><div class="g-panel g-panel-sidebar" id="right-sidebar" style="flex:0 0 280px;width:280px"><h3>Settings</h3><div class="g-field"><label for="backend">Backend</label><select id="backend" data-g-target="backend" data-g-message="input" data-g-event="change" class="g-select"><option value="openai" selected="selected">OpenAI API</option></select></div><div id="model_select" data-g-output="model_select" data-g-kind="ui" class="g-ui-output"></div><div class="g-conditional" data-g-cond="{&quot;op&quot;:&quot;is&quot;,&quot;id&quot;:&quot;backend&quot;,&quot;values&quot;:[&quot;whisper&quot;]}"><div id="download_model_ui" data-g-output="download_model_ui" data-g-kind="ui" class="g-ui-output"></div></div><div class="g-field"><label for="language">Language</label><select id="language" data-g-target="language" data-g-message="input" data-g-event="change" class="g-select"><option value="en" selected="selected">English</option><option value="">Auto-detect</option><option value="es">Spanish</option><option value="fr">French</option><option value="de">German</option><option value="it">Italian</option><option value="pt">Portuguese</option><option value="ja">Japanese</option><option value="zh">Chinese</option></select></div><div class="g-conditional" data-g-cond="{&quot;op&quot;:&quot;is&quot;,&quot;id&quot;:&quot;backend&quot;,&quot;values&quot;:[&quot;openai&quot;]}"><div class="g-field"><label for="api_base">API URL</label><input id="api_base" data-g-target="api_base" data-g-message="input" data-g-event="input" type="text" class="g-input" value="https://api.openai.com"></div><div class="g-field"><label for="api_key">API Key</label><input id="api_key" data-g-target="api_key" data-g-message="input" data-g-event="input" type="password" class="g-input" value="" placeholder="using OPENAI_API_KEY (type to override)"></div></div><span id="status" data-g-output="status" data-g-kind="text" class="g-output g-muted"></span></div></div></div></div>
<script src="/glinty/glinty.js"></script>

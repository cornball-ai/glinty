name: ci

on:
  push:
  pull_request:

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"

jobs:
  ci:
    strategy:
      matrix:
        include:
          - {os: macos-latest}
          - {os: ubuntu-latest}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: eddelbuettel/github-actions/r-ci@master

      - name: Dependencies
        run: ./run.sh install_deps

      - name: Test
        run: ./run.sh run_tests

  # The second lowering. Separate from the R job because it needs the
  # Flutter SDK and nothing else here does -- but it reads the same
  # inst/fixtures/components.json and inst/fixtures/transcripts.json,
  # so a component or an exchange added on the R side fails here until
  # this client answers for it.
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dart/glinty_flutter

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

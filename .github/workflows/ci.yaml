name: ci

on:
  push:
  pull_request:

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"

jobs:
  ci:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: eddelbuettel/github-actions/r-ci@master

      - name: Dependencies
        run: ./run.sh install_deps

      - name: Test
        run: ./run.sh run_tests

  # Ubuntu goes through r2u + rapt instead of r-ci's bspm bootstrap:
  # Python-free, dogfoods cornball's own installer, and the mirror
  # fetch (the part that actually flakes) gets explicit retries.
  ubuntu-rapt:
    # pinned, not -latest: the apt sources below hardcode noble
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/r2u

      - name: Build tools for the rapt .deb
        run: sudo apt-get install -y --no-install-recommends r-base-dev debhelper

      - name: rapt
        env:
          RAPT_REF: fc71e12d8285c02b55d0408126a1be4338ded1d4
        run: |
          git clone https://github.com/cornball-ai/rapt /tmp/rapt
          git -C /tmp/rapt checkout --quiet "$RAPT_REF"
          cd /tmp/rapt/pkg
          dpkg-buildpackage -us -uc -b
          sudo apt-get install -y /tmp/rapt/rapt_*.deb
          Rscript -e 'print(rapt::manager())'

      # Read from DESCRIPTION rather than a hardcoded list: a
      # hardcoded one drifts the moment a dependency is added, and
      # then fails here as a missing-package error that looks like a
      # CI bug rather than the omission it is.
      - name: Dependencies (install.packages -> rapt -> apt -> r2u)
        run: |
          Rscript -e '
            d <- read.dcf("DESCRIPTION", c("Depends", "Imports", "Suggests"))
            pkgs <- trimws(unlist(strsplit(
              gsub("\\s*\\([^)]*\\)", "", d[!is.na(d)]), ",")))
            pkgs <- setdiff(pkgs, c("R", "", rownames(installed.packages())))
            cat("installing:", paste(pkgs, collapse = ", "), "\n")
            if (length(pkgs)) install.packages(pkgs)
          '

      # R CMD build drops files it considers invalid -- a man page
      # named after an S3 method on `$` or `[[`, for one -- and says so
      # in passing rather than failing. The check that follows then
      # examines a tarball those files are not in and reports nothing
      # wrong. Four of glinty's help topics went missing that way while
      # every job here stayed green, so the build's own account of what
      # it threw away is now read.
      - name: Build and check
        run: |
          R CMD build . 2>&1 | tee /tmp/build.log
          if grep -q "excluding invalid files" /tmp/build.log; then
            echo "::error::R CMD build excluded files from the tarball"
            sed -n '/excluding invalid files/,/^\*/p' /tmp/build.log
            exit 1
          fi
          _R_CHECK_FORCE_SUGGESTS_=false R CMD check --no-manual --as-cran glinty_*.tar.gz

      # GLINTY_REQUIRE_BROWSER turns "no browser, so those checks did
      # not run" from a quiet pass into a failure. The runner image
      # ships Google Chrome, so the computed-style checks are expected
      # to run here; if they ever stop, that is either a changed image
      # or a broken find_chrome(), and both should be loud.
      - name: The browser the computed-style checks need
        run: google-chrome --version

      - name: Test
        env:
          GLINTY_REQUIRE_BROWSER: "1"
        run: |
          sudo R CMD INSTALL glinty_*.tar.gz
          Rscript -e 'tinytest::test_package("glinty")'

  # The second lowering. Separate from the R job because it needs the
  # Flutter SDK and nothing else here does -- but it reads the same
  # inst/fixtures/components.json and inst/fixtures/transcripts.json,
  # so a component or an exchange added on the R side fails here until
  # this client answers for it.
  flutter:
    # pinned like ubuntu-rapt: the r2u source below hardcodes noble
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dart/glinty_flutter

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # R and glinty, so server_e2e_test.dart drives the real client
      # against a real server rather than skipping. Without this the
      # suite still passes -- which is exactly why it is here: a
      # skipped e2e that reports green is the failure mode this
      # protocol keeps refusing to ship.
      #
      # Dependencies come from r2u as apt binaries: openssl needs
      # libssl headers to build from source, and the site library
      # needs root either way.
      - uses: ./.github/actions/r2u

      # The Imports list is read out of DESCRIPTION rather than
      # written here twice. Hardcoded, it drifts: adding callr turned
      # this job red for a reason that had nothing to do with Flutter.
      - name: glinty and its dependencies
        working-directory: .
        run: |
          deps=$(Rscript --vanilla -e 'imports <- read.dcf("DESCRIPTION")[1, "Imports"]; pkgs <- trimws(gsub("\\(.*?\\)", "", strsplit(imports, ",")[[1]])); pkgs <- setdiff(pkgs, rownames(installed.packages(priority = "base"))); cat(paste0("r-cran-", tolower(pkgs)), sep = " ")')
          echo "installing: $deps"
          sudo apt-get install -y --no-install-recommends $deps
          sudo R CMD INSTALL .

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: The e2e actually ran (not skipped)
        run: flutter test test/server_e2e_test.dart --reporter expanded
             | tee /tmp/e2e.log
             && ! grep -qi "skip" /tmp/e2e.log

  # The browser client, driven through the same transcripts and
  # fixtures. This is the stage 2 gate: adoption emitting nothing and
  # one-press-one-frame can only be proven here, because only the
  # browser adopts pre-rendered markup.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: node tools/jsbridge.js inst/www/glinty.js

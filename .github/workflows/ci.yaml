name: ci

on:
  push:
  pull_request:

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"

jobs:
  ci:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: eddelbuettel/github-actions/r-ci@master

      - name: Dependencies
        run: ./run.sh install_deps

      - name: Test
        run: ./run.sh run_tests

  # Ubuntu goes through r2u + rapt instead of r-ci's bspm bootstrap:
  # Python-free, dogfoods cornball's own installer, and the mirror
  # fetch (the part that actually flakes) gets explicit retries.
  ubuntu-rapt:
    # pinned, not -latest: the apt sources below hardcode noble
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: r2u and R
        run: |
          wget -q -O- https://eddelbuettel.github.io/r2u/assets/dirk_eddelbuettel_key.asc \
            | sudo tee /etc/apt/trusted.gpg.d/cranapt_key.asc > /dev/null
          echo "deb [arch=amd64] https://r2u.stat.illinois.edu/ubuntu noble main" \
            | sudo tee /etc/apt/sources.list.d/cranapt.list
          wget -q -O- https://cloud.r-project.org/bin/linux/ubuntu/marutter_pubkey.asc \
            | sudo tee /etc/apt/trusted.gpg.d/cran_ubuntu_key.asc > /dev/null
          echo "deb https://cloud.r-project.org/bin/linux/ubuntu noble-cran40/" \
            | sudo tee /etc/apt/sources.list.d/cran_r.list
          printf 'Package: *\nPin: release o=CRAN-Apt Project\nPin: release l=CRAN-Apt Packages\nPin-Priority: 700\n' \
            | sudo tee /etc/apt/preferences.d/99cranapt
          ok=0
          for i in 1 2 3 4; do
            if sudo apt-get update -qq; then ok=1; break; fi
            echo "apt update failed, retry $i"; sleep 45
          done
          test "$ok" = 1 || { echo "apt update failed after 4 attempts"; exit 1; }
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-base-dev debhelper

      - name: rapt
        env:
          RAPT_REF: fc71e12d8285c02b55d0408126a1be4338ded1d4
        run: |
          git clone https://github.com/cornball-ai/rapt /tmp/rapt
          git -C /tmp/rapt checkout --quiet "$RAPT_REF"
          cd /tmp/rapt/pkg
          dpkg-buildpackage -us -uc -b
          sudo apt-get install -y /tmp/rapt/rapt_*.deb
          Rscript -e 'print(rapt::manager())'

      # Read from DESCRIPTION rather than a hardcoded list: a
      # hardcoded one drifts the moment a dependency is added, and
      # then fails here as a missing-package error that looks like a
      # CI bug rather than the omission it is.
      - name: Dependencies (install.packages -> rapt -> apt -> r2u)
        run: |
          Rscript -e '
            d <- read.dcf("DESCRIPTION", c("Depends", "Imports", "Suggests"))
            pkgs <- trimws(unlist(strsplit(
              gsub("\\s*\\([^)]*\\)", "", d[!is.na(d)]), ",")))
            pkgs <- setdiff(pkgs, c("R", "", rownames(installed.packages())))
            cat("installing:", paste(pkgs, collapse = ", "), "\n")
            if (length(pkgs)) install.packages(pkgs)
          '

      - name: Build and check
        run: |
          R CMD build .
          _R_CHECK_FORCE_SUGGESTS_=false R CMD check --no-manual --as-cran glinty_*.tar.gz

      - name: Test
        run: |
          sudo R CMD INSTALL glinty_*.tar.gz
          Rscript -e 'tinytest::test_package("glinty")'

  # The second lowering. Separate from the R job because it needs the
  # Flutter SDK and nothing else here does -- but it reads the same
  # inst/fixtures/components.json and inst/fixtures/transcripts.json,
  # so a component or an exchange added on the R side fails here until
  # this client answers for it.
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dart/glinty_flutter

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # The browser client, driven through the same transcripts and
  # fixtures. This is the stage 2 gate: adoption emitting nothing and
  # one-press-one-frame can only be proven here, because only the
  # browser adopts pre-rendered markup.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: node tools/jsbridge.js inst/www/glinty.js
